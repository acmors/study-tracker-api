spring:
  application:
    name: api-study-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/study-tracker-0db
    username:
    password:
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  flyway:
    enabled: true
    locations: classpath:db/migration
